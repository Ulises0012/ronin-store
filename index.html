    <meta name="description" content="RONIN STORE: anime, K-pop, amigurumis, camisas y tazas personalizadas, globos y rosas. Pedidos por WhatsApp en El Salvador." />
    <meta name="theme-color" content="#14121C" />

    <title>RONIN STORE</title>
    <script>
      try {
        var t = localStorage.getItem('ronin-tema');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
